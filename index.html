<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eminence Global Compliences</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
            opacity: 0.8;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .loader {
            margin: 25px auto;
            width: 50px;
            height: 50px;
            border: 4px solid #fff;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Eminence Global Compliences</h1>
        <h2>🚀 We’re Launching Soon</h2>

        <div class="loader"></div>

        <p>Our website is under construction.</p>
        <p>We’re working hard to bring you something amazing.</p>

        <footer>
            © 2026 Eminence Global Compliences. All rights reserved.
        </footer>
    </div>
</body>
</html>
